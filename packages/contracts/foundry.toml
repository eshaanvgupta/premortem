[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.39"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
extra_output = ["metadata"]
gas_reports = ["PremortemRegistry"]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[fmt]
line_length = 110
