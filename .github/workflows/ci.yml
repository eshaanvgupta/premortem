name: Validate NEXORA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.10.0
      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Format, lint and strict types
        run: |
          pnpm --filter @premortem/web exec next typegen
          pnpm format:check
          pnpm lint
          pnpm typecheck
      - name: Core and wallet-adapter tests
        run: pnpm test
      - name: Solidity unit, fuzz and invariant tests
        run: pnpm test:contracts
      - name: Gas snapshot and local isolated EVM smoke
        run: |
          node scripts/contracts.mjs snapshot
          node scripts/contracts.mjs smoke
      - name: Production build
        run: pnpm build
      - name: Source secret pattern scan
        run: pnpm secret:scan
      - name: Dependency advisory audit
        run: |
          mkdir -p artifacts
          pnpm audit --prod --audit-level high --json > artifacts/dependency-audit.json
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser, mobile and accessibility workflows
        run: pnpm test:e2e
      - name: Isolated EVM browser protocol workflow
        run: pnpm test:protocol
      - name: Lighthouse report on actual local production page
        run: |
          node scripts/start-web.mjs > /tmp/premortem-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null && break; sleep 1; done
          pnpm lighthouse
      - name: Build Docker image without secrets or publishing
        run: docker build --tag premortem:ci .
      - name: Static hosting build and isolated contract creation workflow
        run: |
          pnpm build:static
          pnpm test:deployment
      - name: Produce local source deployment package
        run: node scripts/release.mjs
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: premortem-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/
            test-results/
            playwright-report/
            packages/contracts/reports/
            packages/contracts/verification/
            release/

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - name: Install Slither and exact compiler
        run: |
          pipx install slither-analyzer
          pipx install solc-select
          solc-select install 0.8.39
          solc-select use 0.8.39
      - name: Solidity static analysis
        working-directory: packages/contracts
        run: |
          mkdir -p reports
          slither src/PremortemRegistry.sol --solc $(command -v solc) --json reports/slither-ci.json --fail-high
      - name: Upload actual static analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: premortem-static-analysis
          path: packages/contracts/reports/slither-ci.json
          if-no-files-found: warn
